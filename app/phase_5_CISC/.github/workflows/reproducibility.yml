name: Export Reproducibility Pipeline (Phase 3)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-reproducibility:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openssl pkg-config libcairo2-dev build-essential

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        cd operation-room/backend
        pip install \
          pytest pytest-asyncio \
          duckdb \
          fastapi pydantic pydantic-settings \
          canonicaljson cryptography rfc3161ng requests

    - name: Run Cryptographic Export Reproducibility Tests
      run: |
        cd operation-room/backend
        export PYTHONPATH=$PWD
        pytest tests/test_reproducibility.py -v
